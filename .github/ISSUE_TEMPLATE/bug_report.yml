name: Bug report
description: Something is wrong, crashes or gives a number you do not believe
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, attach the scenario JSON (File, Save scenario) or the CSV you imported.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OutbreakScope version
      description: Shown in the About view.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The random seed (shown in the app) makes stochastic bugs reproducible.
