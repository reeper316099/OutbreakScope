name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Let Electron's process sandbox work on the runner (keeps the sandbox ON; no --no-sandbox)
        run: |
          # Newer Electron builds may not ship the setuid helper; Ubuntu 24.04 also restricts unprivileged user namespaces.
          if [ -f node_modules/electron/dist/chrome-sandbox ]; then
            sudo chown root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: End-to-end tests (Electron under a virtual display)
        run: xvfb-run --auto-servernum npx playwright test
